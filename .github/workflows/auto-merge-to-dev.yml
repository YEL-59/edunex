name: Auto Merge to Dev

on:
  push:
    branches-ignore:
      - 'dev'
      - 'main'

permissions:
  contents: write

jobs:
  auto-merge:
    name: Auto Merge into Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout dev branch
        run: |
          git checkout dev
          git pull origin dev

      - name: Merge pushed branch into dev
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Attempting to merge branch '$BRANCH_NAME' into 'dev'..."

          if git merge origin/$BRANCH_NAME --no-ff -m "Auto-merge '$BRANCH_NAME' into dev [skip ci]"; then
            echo "Successfully merged '$BRANCH_NAME' into 'dev'."
          else
            echo "::error::Merge conflict encountered between '$BRANCH_NAME' and 'dev'. Please resolve conflicts manually."
            git merge --abort
            exit 1
          fi

      - name: Push updated dev branch
        run: |
          git push origin dev
